<html>
    <head>
        <style>

            {
                display: inline-block;
                border: 1px solid lightgreen;
                height: 100px;
                width: 100px;
                padding: 20px;
                margin-top: 50px;
            }
            .s2
            {
                display: none;
            }

            .s1
            {
                text-align: center;

            }
            img
            {
                display: block;
                height: 300px;
                width :450px;
                border-radius: 30px;
                margin: 0px auto;
            }
</style>
    </head>
    <body>
        <div class="d1">Box 1</div><!--Block-->
        <div class="d1">Box 2</div><!--Block-->

</html>
