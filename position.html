<!--position:static relative absolute fixed sticky-->
<html>
    <head>
        <style>
            .container,.container1
            {
                height: 800px;
                border:1px solid red;
                margin-top: 50px;
                position: relative;
            }
            .box
            {
                height: 100px;
                width: 100px;
                border: 1px solid lightgreen;
                text-align: center;
                font-size: 30px;
                padding: 20px;
            }
            #b1
            {
                background-color: rgb(253, 197, 222);
                top: 50px;
                left: 50px;
                position: relative;/*default static therefor can't move*/
            }
            #b2
            {
                background-color: rgb(219, 201, 250);
                top: 50px;
                position: relative;
                left: 100px;
                z-index: 1;
            }
            #b3
            {
                background-color:grey;
                position: absolute;/*box 4 */
                top: 0;
                right: 20px;
            }
            #b4
            {
                background-color: cadetblue;
                position: fixed;
                bottom: 0;
                right: 150px;
                border-radius: 50%;
            }
            #b5
            {
                background-color: burlywood;
                position: sticky;
                top: 0;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="box" id="b1">1</div>
            <div class="box" id="b2">2</div>
            <div class="box" id="b3">3</div>
            <div class="box" id="b4">4</div>
            <div class="box" id="b5">5</div>
        </div>
        <div class="container1"></div>
    </body>
</html>
