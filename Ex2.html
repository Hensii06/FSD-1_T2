<!--By focusing on field smoothly change background color to light blue 
and color to blue in 5 sec and also move field 10px horizontally and 
add border of 3 px dashed blue in 7 sec.
Use easing in for smooth transition-->
<html>
    <input type="text" id="i1">
    <button value="Submit">Submit</button>
    <style>
        button
        {
            background-color: black;
            color: white;
            padding: 10px 30px;
            border: 1px solid black;   
            transition: all 5s ease-in;  
        }
        button:hover
        {
            background-color: white;
            color: black;
            padding: 15px 35px;
            border: 5px double black;
            box-shadow: 2px 2px 20px blue;
        }
        #i1:focus
        {
            background-color: lightblue;
            color: blue;
            transform: translateX(10px);
            border: 3px dashed blue;
        }
        #i1
        {
            transition: background-color 5s ease-in,
            color 5s ease-in,transform 7s ease-in,border 7s ease-in;
        }
    </style>
</html>
