<html>
    <div class="d1">Box 1</div>
    <img src="1.jpg"/>
    <style>
        .d1
        {
            height: 100px;
            width: 100px;
            border: 3px solid rgb(177, 240, 198);
            background-color: antiquewhite;
            padding: 20px;
            text-align: center;
            border-radius: 20px;
            margin: 50px auto;
            /*use transition*/
            transition-property: background-color border;
            transition-duration:10s; /*1s=1000ms*/
            transition-delay: 1s;
            transition-timing-function: ease-in-out;
            /* ease ease-in ease-out linear ease-in-out */
        }
        img
        {
            height: 100px;
            width: 100px;
            display: block;
            margin: 50px auto;
            background-color:black ;
            padding: 20px;
            /*use transition*/
            transition: all 5s ease-in 1s;
        }
        .d1:hover
        {
            background-color: rgb(193, 248, 250);
            border: 5px dashed rgb(232, 194, 232);
            padding: 30px;
            border-radius: 35px;
            box-shadow: 3px 3px 20px black;
        }
        img:active
        {
            background-color: aliceblue;
            transform: scale(1.2) rotate(720deg);
        }
    </style>
</html>
