<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .d1{
            height: 200px;
            width: 200px;
            margin: 20px auto;
            background-image: linear-gradient(to top,red,orange,yellow);
            background-color: green;
            /* 0= to top */  
        }
     .d2{
            height: 200px;
            width: 200px;
            margin: 20px auto;
            background-image: linear-gradient(0deg,red,orange,yellow);
            background-color: green;
            /* 0= to top */  
        }
         .d3{
            height: 200px;
            width: 200px;
            margin: 20px auto;
            background-image: linear-gradient(red 30%,orange 40%,yellow 30%);
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="d1"></div>
    <div class="d2"></div>
    <div class="d3"></div>
</body>
</html>
